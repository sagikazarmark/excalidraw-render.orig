[package]
name = "excalidraw-render-package-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["cjk"]
cjk = ["excalidraw-render/cjk"]

[dependencies]
excalidraw-render = { path = "../../target/package/excalidraw-render-0.1.0", version = "=0.1.0", default-features = false }

[dev-dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.141"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[patch.crates-io]
excalidraw-fonts = { path = "../../target/package/excalidraw-fonts-0.1.0" }
excalidraw-fonts-cjk-000 = { path = "../../target/package/excalidraw-fonts-cjk-000-0.1.0" }
excalidraw-fonts-cjk-001 = { path = "../../target/package/excalidraw-fonts-cjk-001-0.1.0" }

[workspace]
