name: PDF harness gates

# The PDF viewer and structural gates are #[ignore]d because they need the
# exact-pinned PDFium, PDF.js and qpdf harness (tools/pdf-harness/install.sh:
# Linux x86_64, host Python 3.12.3, Docker for the PDF.js container). Nothing
# else runs them, so their expectations drifted unnoticed (#107). This job runs
# them on every push to main and nightly, and can be dispatched by hand; it is
# not a required pull-request check, so a PDF-affecting change may still repin
# the gates in its own round (#109). The PDF.js viewer runs in Docker, so this
# leg stays on GitHub Actions rather than the Dagger mirror.
#
# Every one of these gates lives in the `harness_pdf_viewers` test binary, and
# the `harness` nextest profile selects the harness binaries by name, so a
# gate joins this run by being written there rather than by being listed here.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-harness-gates:
    name: Ignored PDF harness gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install pinned cargo-nextest
        shell: bash
        run: bash tests/package-consumer/install-cargo-nextest.sh "$RUNNER_TEMP/nextest"
      - name: Install the exact-pinned PDF harness
        shell: bash
        run: |
          python3 --version
          docker --version
          bash tools/pdf-harness/install.sh
      # The SVG viewer harness binary needs the pinned Chromium container this
      # runner does not install, so the profile is narrowed to the PDF binaries.
      - name: Run the PDF harness gates
        shell: bash
        run: >-
          cargo nextest run --locked --release -p excalidraw-render
          --profile harness --run-ignored only -E 'binary(/^harness_pdf_/)'
