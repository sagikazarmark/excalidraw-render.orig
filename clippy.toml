# Rendering math calls transcendental functions only through
# `crates/excalidraw-render/src/portable_math.rs`, which routes them to the
# pure-Rust `libm` crate so both supported targets compute the same double
# (ADR-0007). The `std` methods below are not correctly rounded and resolve to a
# different implementation per target (glibc on Linux, `compiler-builtins` on
# wasm32), so a new call site adds a wrapper there instead of calling them.
# `powi` is a compiler intrinsic with an unspecified expansion; `square` and
# `cube` in the same module replace it. `sqrt`, `abs`, the rounding functions,
# `min`/`max`, `copysign`, `rem_euclid` and `mul_add` are exact or correctly
# rounded under IEEE 754 and stay on `std`.
disallowed-methods = [
    { path = "f64::sin", reason = "call crate::portable_math::sin (ADR-0007)" },
    { path = "f64::cos", reason = "call crate::portable_math::cos (ADR-0007)" },
    { path = "f64::sin_cos", reason = "call crate::portable_math::sin_cos (ADR-0007)" },
    { path = "f64::tan", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::asin", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::acos", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::atan", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::atan2", reason = "call crate::portable_math::atan2 (ADR-0007)" },
    { path = "f64::sinh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::cosh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::tanh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::asinh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::acosh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::atanh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::exp", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::exp2", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::exp_m1", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::ln", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::ln_1p", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::log", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::log2", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::log10", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f64::powf", reason = "call crate::portable_math::powf (ADR-0007)" },
    { path = "f64::powi", reason = "call crate::portable_math::square or cube (ADR-0007)" },
    { path = "f64::hypot", reason = "call crate::portable_math::hypot (ADR-0007)" },
    { path = "f64::cbrt", reason = "call crate::portable_math::cbrt (ADR-0007)" },
    { path = "f32::sin", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::cos", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::sin_cos", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::tan", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::asin", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::acos", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::atan", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::atan2", reason = "route through crate::portable_math (ADR-0007)" },
