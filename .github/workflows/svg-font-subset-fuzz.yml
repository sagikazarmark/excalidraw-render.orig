name: Nightly randomized expansions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Fixed-seed native expansion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Execute bounded font subset fuzz expansion
        env:
          EXCALIDRAW_FONT_SUBSET_FUZZ_CASES: "4096"
        run: >-
          cargo test --locked --release -p excalidraw-render --lib
          render::font_subset_fuzz::nightly_font_subset_fuzz_is_bounded_and_deterministic
          -- --ignored --exact

  frame-batch-property:
    name: Deeper frame batch expansion
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Execute deeper batch-versus-standalone expansion
        env:
          EXCALIDRAW_FRAME_BATCH_CASES: "512"
        run: >-
          cargo test --locked --release -p excalidraw-render --lib
          render::frame_batch_property::nightly_frame_batch_property_runs_a_deeper_sample
          -- --ignored --exact

  scene-fuzz:
    name: Scene admission and normalization fuzz expansion
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Execute bounded scene fuzz expansion
        env:
          EXCALIDRAW_SCENE_FUZZ_CASES: "4096"
        run: >-
          cargo test --locked --release -p excalidraw-render --lib
          scene_fuzz::nightly_scene_fuzz_is_bounded_and_deterministic
          -- --ignored --exact

  browser-wasm-regressions:
    name: Bounded smoke in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh wasm32-unknown-unknown "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install pinned Chromium and ChromeDriver
        shell: bash
        run: bash tests/package-consumer/install-browser-tools.sh "$RUNNER_TEMP/browser"
      - name: Install pinned WASM test runner
        shell: bash
        run: bash tests/package-consumer/install-wasm-test-runner.sh "$RUNNER_TEMP/wasm-test-runner"
      - name: Execute font subset and scene fuzz smokes
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/package-consumer/fontconfig.xml
          WASM_BINDGEN_TEST_TIMEOUT: "1800"
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/tests/package-consumer/webdriver.json
        shell: bash
        run: |
          chrome="$(jq -er '.browser.tools.chromium.binary' tests/package-consumer/tool-manifest.json)"
          driver="$(jq -er '.browser.tools.chromedriver.binary' tests/package-consumer/tool-manifest.json)"
          for filter in wasm_tests::font_subset_fuzz_ wasm_tests::scene_fuzz_; do
            PATH="$RUNNER_TEMP/browser/$(dirname "$chrome"):$PATH" \
              CHROMEDRIVER="$RUNNER_TEMP/browser/$driver" \
              CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
              cargo test --locked --release -p excalidraw-render --lib \
                --target wasm32-unknown-unknown \
                "$filter"
          done
