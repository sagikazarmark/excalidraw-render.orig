[workspace]
members = [
    "crates/excalidraw-render",
    "crates/excalidraw-fonts",
    "crates/excalidraw-fonts-xiaolai",
    "crates/excalidraw-fonts-xiaolai-extended",
    "crates/excalidraw-render-cli",
    "crates/excalidraw-render-compare",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/excalidraw"
homepage = "https://github.com/sagikazarmark/excalidraw"
# The toolchain the CI gates build with (`tests/package-consumer/tool-manifest.json`,
# `dagger.toml` pin its patch release); older compilers are not exercised.
rust-version = "1.97"

[workspace.dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
clap = { version = "=4.6.7", features = ["derive"] }
excalidraw-render = { path = "crates/excalidraw-render", version = "=0.1.0" }
excalidraw-fonts = { path = "crates/excalidraw-fonts", version = "=0.1.0", default-features = false }
excalidraw-fonts-xiaolai = { path = "crates/excalidraw-fonts-xiaolai", version = "=0.1.0" }
excalidraw-fonts-xiaolai-extended = { path = "crates/excalidraw-fonts-xiaolai-extended", version = "=0.1.0" }
csscolorparser = "=0.8.3"
cssparser = "=0.38.0"
cssparser-color = "=0.6.0"
crc32fast = "=1.5.2"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = "=0.2.4"
jsonschema = { version = "=0.33.0", default-features = false }
# The PDF writer (ADR-0021). Pinned exactly: a Krilla bump is a byte-affecting
# change for every PDF, as svg2pdf's was. Krilla shapes nothing (every glyph
# arrives positioned). `raster-images` only compiles its image module: every
# image arrives as sample planes, so Krilla decodes nothing, and the
# `zune-jpeg` default features it enables are the ones `resvg`'s
# `raster-images` already enables. krilla-svg is ported as
# `render/pdf/svg_draw.rs` instead of depended on, because its `tiny-skia` and
# `resvg` default features would reach the PNG rasterizer.
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
# Rendering math calls every transcendental function through this crate
# (`crates/excalidraw-render/src/portable_math.rs`, ADR-0007) so that both
# supported targets compute the same doubles. It is already in the lock through
# `rustybuzz -> core_maths`; the direct edge adds no package.
libm = "=0.2.16"
miniz_oxide = "=0.8.9"
moxcms = { version = "=0.9.0", default-features = false }
png = "=0.18.1"
jpeg-encoder = "=0.6.1"
resvg = { version = "=0.47.0", default-features = false, features = ["raster-images"] }
roxmltree = "=0.21.1"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
# Held at 1.0.141 (#206): 1.0.142+ formats floats through zmij, which writes
# positive exponents as `1e+20` where 1.0.141 wrote `1e20`. Report values such
# as an over-limit coordinate's attempted magnitude reach that range, so the
# bump changes report bytes (spec 11.1) and belongs with #207.
serde_json = "=1.0.141"
simplecss = "=0.2.2"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
# The upstream malformed-name fix replaces the safety adapter. The frozen
# profile token stays at 0.5.1 until ADR-0003's single evidence refresh.
skera = { version = "=0.7.0", default-features = false }
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
ryu-js = { version = "=1.0.3", default-features = false }
unicode-bidi = "=0.3.18"
unicode-normalization = "=0.1.24"
unicase = "=2.9.0"
svgtypes = "=0.16.1"
# Host-only: CLI delivery staging and xtask scratch directories. Never a
# renderer dependency, so random temporary names cannot reach output bytes.
tempfile = "=3.27.0"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["png-format", "std"] }
# `default-features = false` drops upstream's `cli` feature (and `clap`);
# `portable-float` passes through to `brotli/portable-float`, which is what keeps
# quality-11 WOFF2 bytes identical between native and wasm32 (ADR-0003). The
# identity token in `excalidraw-fonts` still names the retired
# fork until the single evidence refresh ADR-0003 schedules.
ttf2woff2 = { version = "=0.13.3", default-features = false, features = ["portable-float"] }
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
wuff = { version = "=0.2.8", default-features = false, features = ["brotli"] }
# `write_fonts::read` is the renderer's only font parser: read-fonts 0.44,
# the version skera plans over. Name handling and the typed layout validator
# (ADR-0020) read subsets through it, so the workspace has no direct read-fonts
# dependency.
write-fonts = { version = "=0.53.0", default-features = false, features = ["read", "tables"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# `cargo test` builds with this profile. It keeps the `dev` semantics the suite
# relies on for diagnosis — debug assertions, overflow checks, unwinding,
# debuginfo for backtraces — and only turns codegen optimization on: brotli
# quality 11, WOFF2 decoding, SSIM, resvg rasterization and large-JSON parsing
# dominate the push gate and run an order of magnitude slower unoptimized.
# `profile.release` is deliberately not reused for tests: its single codegen
# unit and fat LTO slow every compile, and `strip` removes backtraces.
[profile.test]
opt-level = 2

# `cargo run -p xtask -- catalog verify` decodes all 230 official font chunks
# and the `conformance verify-*` commands digest large evidence files, so the
# `dev` profile optimizes dependencies too. Workspace members are excluded, which
# keeps the edit-compile loop on the renderer itself fast. `test` inherits this
# override, so `cargo run` and `cargo test` share the compiled external
# dependencies and differ only in the workspace members' own opt-level.
[profile.dev.package."*"]
opt-level = 2
