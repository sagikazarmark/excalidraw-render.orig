[workspace]
resolver = "2"

[package]
name = "excalidraw-render-svg-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "excalidraw-render-svg-viewer"
path = "src/main.rs"

[dependencies]
base64 = { version = "=0.23.0", default-features = false, features = ["alloc"] }
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images", "text"] }
roxmltree = "=0.21.1"
serde_json = "=1.0.141"
sha2 = { version = "=0.10.9", default-features = false }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
usvg = { version = "=0.48.1", default-features = false, features = ["text"] }

[lints.rust]
unsafe_code = "forbid"
