[workspace]
members = [
    "crates/brotli-deterministic",
    "crates/excalidraw-render",
    "crates/excalidraw-render-assets-base",
    "crates/excalidraw-render-assets-data-000",
    "crates/excalidraw-render-assets-data-001",
    "crates/excalidraw-render-cli",
    "crates/excalidraw-render-compare",
    "crates/skera-safe",
    "crates/ttf2woff2-deterministic",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.98"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
clap = { version = "=4.5.41", features = ["derive"] }
excalidraw-render = { path = "crates/excalidraw-render", version = "=0.1.0" }
excalidraw-render-assets-base = { path = "crates/excalidraw-render-assets-base", version = "=0.1.0" }
excalidraw-render-assets-data-000 = { path = "crates/excalidraw-render-assets-data-000", version = "=0.1.0" }
excalidraw-render-assets-data-001 = { path = "crates/excalidraw-render-assets-data-001", version = "=0.1.0" }
csscolorparser = "=0.8.3"
cssparser = "=0.37.0"
cssparser-color = "=0.5.0"
crc32fast = "=1.4.2"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = "=0.2.4"
jsonschema = { version = "=0.33.0", default-features = false }
miniz_oxide = "=0.8.9"
moxcms = { version = "=0.9.0", default-features = false }
png = "=0.17.16"
pdf-writer = "=0.12.0"
jpeg-encoder = "=0.6.1"
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
roxmltree = "=0.20.0"
regex = "=1.13.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
skera = { package = "excalidraw-render-skera", path = "crates/skera-safe", version = "=0.1.0" }
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
read-fonts = { version = "=0.42.1", features = ["experimental_traverse"] }
unicode-bidi = "=0.3.18"
unicode-normalization = "=0.1.24"
unicase = "=2.9.0"
svg2pdf = { version = "=0.13.0", default-features = false, features = ["filters", "image", "text"] }
svgtypes = "=0.15.3"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["png-format", "std"] }
ttf2woff2 = { package = "excalidraw-render-ttf2woff2", path = "crates/ttf2woff2-deterministic", version = "=0.1.0", default-features = false }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
wuff = { version = "=0.2.8", default-features = false, features = ["brotli"] }
write-fonts = { version = "=0.51.0", default-features = false, features = ["read", "tables"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
