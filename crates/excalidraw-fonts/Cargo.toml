[package]
name = "excalidraw-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pinned Excalidraw fonts and complete font catalog with optional CJK payloads"
license.workspace = true
repository.workspace = true
include = [
    "/src/",
    "/tests/",
    "/catalog/",
    "/data/",
    "/license-parts/",
    "/LICENSE-BUNDLE.txt",
    "/LICENSE-BUNDLE.sha256",
]

[lints]
workspace = true

[features]
default = ["cjk"]
cjk = ["dep:excalidraw-fonts-cjk-000", "dep:excalidraw-fonts-cjk-001"]

[dependencies]
excalidraw-fonts-cjk-000 = { workspace = true, optional = true }
excalidraw-fonts-cjk-001 = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
rustybuzz.workspace = true
serde_json.workspace = true
wuff.workspace = true
