[workspace]
resolver = "2"

[package]
name = "png-raster-reuse-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] }
zeno = { version = "=0.3.3", default-features = false, features = ["eval", "libm"] }
serde_json = "=1.0.141"

[lints.rust]
unsafe_code = "forbid"
