[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
excalidraw-fonts = { workspace = true, features = ["cjk"] }
excalidraw-render-compare = { path = "../crates/excalidraw-render-compare" }
jsonschema.workspace = true
libm.workspace = true
base64.workspace = true
clap.workspace = true
miniz_oxide.workspace = true
png.workspace = true
roxmltree.workspace = true
regex.workspace = true
# svg_font_subset_runner drives the controlled pure-Rust SVG viewer
# (tools/svg-viewer-rust, its own lock on resvg/usvg 0.48.1) and reads and
# shapes fonts as that viewer's usvg does: skrifa 0.44 and HarfRust 0.12, as
# upstream v0.48.1 locks them. They move when the viewer is requalified, not
# with the renderer's HarfRust.
viewer-harfrust = { package = "harfrust", version = "=0.12.0" }
viewer-skrifa = { package = "skrifa", version = "=0.44.0", default-features = false, features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
sha2.workspace = true
tempfile.workspace = true
syn = { version = "=3.0.7", features = ["full"] }
toml = "=1.1.8"
wuff.workspace = true
write-fonts.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
