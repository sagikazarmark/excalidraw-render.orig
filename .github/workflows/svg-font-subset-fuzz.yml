name: Nightly randomized expansions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  nightly:
    name: Nightly (${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [font-subset-fuzz, frame-batch-property, scene-fuzz, asset-fuzz, render-fuzz]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@f2d55def32daee3f89bb3dfa0499b439a988392a # v0.2.0

      - name: Expand
        run: just nightly-${{ matrix.task }}

  wasm:
    name: Browser WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@f2d55def32daee3f89bb3dfa0499b439a988392a # v0.2.0

      - name: Qualification
        run: just qualification wasm32-unknown-unknown

      - name: Packaged consumers
        run: just wasm-packaging

      - name: Snapshot replay
        run: just wasm-snapshot-replay

      - name: Complete-render fuzz smoke
        run: just render-fuzz-wasm
