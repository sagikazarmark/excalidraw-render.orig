version: 2

updates:
  # A lock update can change artifact bytes, so each one runs every gate and is
  # adopted through review (see the pinning policy in Cargo.toml). The crates
  # whose code computes artifact bytes (decoders, shaping, subsetting,
  # rasterization, the PDF writer, compression, number formatting) form their
  # own group: it moves the golden record and the parity pins, so release.md
  # merges it only between minor releases, in one restage. The rest moves
  # weekly.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      output-bytes:
        patterns:
          - "krilla"
          - "harfrust"
          - "usvg"
          - "resvg"
          - "tiny-skia"
          - "tiny-skia-path"
          - "skera"
          - "wuff"
          - "ttf2woff2"
          - "write-fonts"
          - "read-fonts"
          - "skrifa"
          - "fontdb"
          - "zune-jpeg"
          - "png"
          - "gif"
          - "image-webp"
          - "moxcms"
          - "miniz_oxide"
          - "brotli*"
          - "libm"
          - "ryu-js"
          - "unicode-bidi"
          - "unicode-normalization"
      cargo:
        patterns:
          - "*"

  # The reference profile binds the oracle's npm lock and the bundle built from
  # it (renderer spec 3.2), so a change is a reviewed profile change, never an
  # automatic one. The ignore also covers security updates: the oracle builds
  # once and renders committed fixtures with the network off.
  - package-ecosystem: npm
    directory: /tools/reference-oracle
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
