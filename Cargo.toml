[package]
name = "excalidraw-render"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Excalidraw renderer for SVG, PNG, and PDF"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "=1.0.98"
clap = { version = "=4.5.41", features = ["derive"] }
euclid = "=0.22.11"
resvg = { version = "=0.45.1", default-features = false }
roughr = "=0.12.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
svg2pdf = { version = "=0.13.0", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["png-format", "std"] }
usvg = { version = "=0.45.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
