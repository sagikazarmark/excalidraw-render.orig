[package]
name = "excalidraw-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust rendering of Excalidraw scene documents"
license.workspace = true

[lints]
workspace = true

[features]
# Runs the release-mode qualification set under `cargo test`: the corpus-driven
# and generated-property tests that take minutes even when optimized, so the
# push gate leaves them `#[ignore]`d and the release-mode workflows enable the
# feature and run them in `--release`. The feature adds nothing to the library;
# it only lifts the `#[ignore]` from those `#[cfg(test)]` functions.
release-qualification = []

[dependencies]
excalidraw-render-assets-base.workspace = true
base64.workspace = true
csscolorparser.workspace = true
cssparser.workspace = true
cssparser-color.workspace = true
crc32fast.workspace = true
gif.workspace = true
image-webp.workspace = true
libm.workspace = true
miniz_oxide.workspace = true
moxcms.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skera.workspace = true
png.workspace = true
pdf-writer.workspace = true
resvg.workspace = true
roxmltree.workspace = true
rustybuzz.workspace = true
# Not named in any `use`: the renderer reaches read-fonts through the
# `write_fonts::read` re-export, but `write-fonts` does not enable its
# `experimental_traverse` feature. This direct dependency turns it on for
# `write_fonts::read::traversal`, which the SVG font subsetter's layout-table
# closure walks (`render/font_subset.rs`).
read-fonts.workspace = true
unicode-bidi.workspace = true
svgtypes.workspace = true
svg2pdf.workspace = true
tiny-skia.workspace = true
ttf2woff2.workspace = true
usvg.workspace = true
wuff.workspace = true
write-fonts.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
excalidraw-render-compare = { path = "../excalidraw-render-compare" }
jpeg-encoder.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
