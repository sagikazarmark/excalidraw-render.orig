version: 2

updates:
  # A lock update can change artifact bytes, so each one runs every gate and is
  # adopted through review (see the pinning policy in Cargo.toml).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    # Moves that change output and need evidence restaged are adopted on
    # their own branches; each removes its entries when it lands.
    ignore:
      # fontations and HarfRust share one read-fonts and move together.
      - dependency-name: harfrust
      - dependency-name: skera
      - dependency-name: write-fonts
      # resvg and usvg move with the pure-Rust SVG viewer.
      - dependency-name: resvg
      - dependency-name: usvg

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
