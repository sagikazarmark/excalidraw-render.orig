[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
excalidraw-fonts = { workspace = true, features = ["cjk"] }
excalidraw-render-compare = { path = "../crates/excalidraw-render-compare" }
jsonschema.workspace = true
libm.workspace = true
base64.workspace = true
clap.workspace = true
miniz_oxide.workspace = true
png.workspace = true
roxmltree.workspace = true
regex.workspace = true
ttf-parser.workspace = true
# The pure-Rust SVG viewer (svg_font_subset_runner) shapes as usvg 0.47 does;
# it follows usvg to HarfRust 0.12 with #209.
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
sha2.workspace = true
tempfile.workspace = true
syn = { version = "=3.0.6", features = ["full"] }
toml = "=1.1.6"
wuff.workspace = true
