name: CI (sharded prototype)

# Prototype of the Test job as one build and four test shards: the test targets
# compile once into a nextest archive, and each shard downloads it and runs a
# quarter of the tests. The `release-cli` test group builds the release CLI, so
# it runs in its own job, from the start, rather than once per shard. Compare
# the wall time with the Test job of CI.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces keep file and line, without the full debuginfo that dominates
  # link time and the archive size.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  build:
    name: Build tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The prototype saves from its own branch so a re-run measures a warm
          # build; a real workflow would save only from main.
          shared-key: sharded-build
          cmd-format: devenv shell -- {0}

      - name: CI tool tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Build and archive the test targets
        run: cargo nextest archive --locked --workspace --archive-file tests.tar.zst

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: tests.tar.zst
          retention-days: 1
          # The archive is already zstd-compressed.
          compression-level: 0

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Some checks read files from earlier commits.
          fetch-depth: 0

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Some xtask tests build helper tools (the viewer font tool, the PDF
      # harness wrappers) with Cargo.
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sharded-test
          cmd-format: devenv shell -- {0}

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      # Extracting into the checkout puts every binary at the path the build
      # compiled in (`env!("CARGO_BIN_EXE_…")`): runner workspaces share one path.
      # The `default` profile is the union of the fast and render tiers.
      - name: Run shard ${{ matrix.shard }}
        run: >-
          cargo nextest run
          --archive-file tests.tar.zst
          --extract-to .
          --extract-overwrite
          --profile default
          --no-fail-fast
          --partition slice:${{ matrix.shard }}/4
          -E 'not group(release-cli)'

  release-cli:
    name: Test (release CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Some checks read files from earlier commits.
          fetch-depth: 0

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sharded-release-cli
          cmd-format: devenv shell -- {0}

      # The command the representative gate runs; the tests then find it fresh.
      - name: Build the release CLI
        run: cargo build --release --locked -p excalidraw-render-cli

      - name: Run the release-CLI tests
        run: >-
          cargo nextest run
          --locked
          --workspace
          --profile default
          --no-fail-fast
          -E 'group(release-cli)'
