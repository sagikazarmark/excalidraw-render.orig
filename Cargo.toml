[workspace]
members = [
    "crates/excalidraw-render",
    "crates/excalidraw-render-cli",
    "crates/excalidraw-render-compare",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.98"
clap = { version = "=4.5.41", features = ["derive"] }
euclid = "=0.22.11"
excalidraw-render = { path = "crates/excalidraw-render", version = "=0.1.0" }
jsonschema = { version = "=0.33.0", default-features = false }
png = "=0.17.16"
resvg = { version = "=0.45.1", default-features = false }
roxmltree = "=0.20.0"
roughr = "=0.12.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
svg2pdf = { version = "=0.13.0", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["png-format", "std"] }
usvg = { version = "=0.45.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
