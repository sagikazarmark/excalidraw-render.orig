[package]
name = "excalidraw-fonts"
version = "0.1.0+excalidraw.0.18.1"
edition.workspace = true
rust-version.workspace = true
description = "Pinned Excalidraw fonts and complete font catalog with optional CJK payloads"
license.workspace = true
repository.workspace = true
include = [
    "/src/",
    "/tests/",
    "/catalog/",
    "/fonts/",
    "/license-parts/",
    "/LICENSE-BUNDLE.txt",
    "/LICENSE-BUNDLE.sha256",
]

[lints]
workspace = true

[features]
default = ["cjk"]
cjk = ["dep:excalidraw-fonts-xiaolai", "dep:excalidraw-fonts-xiaolai-extended"]

[dependencies]
excalidraw-fonts-xiaolai = { workspace = true, optional = true }
excalidraw-fonts-xiaolai-extended = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
ttf-parser.workspace = true
serde_json.workspace = true
wuff.workspace = true
