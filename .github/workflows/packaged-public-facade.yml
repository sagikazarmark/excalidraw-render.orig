name: Packaged public facade evidence

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  evidence:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@f2d55def32daee3f89bb3dfa0499b439a988392a # v0.2.0

      - name: Execute and aggregate both supported targets
        run: just target-evidence

      - name: Upload the target evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: svg-font-subset-target-aggregate
          path: target/release-evidence
