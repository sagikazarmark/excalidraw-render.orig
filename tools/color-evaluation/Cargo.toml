[package]
name = "color-evaluation"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
excalidraw-render = { path = "../../crates/excalidraw-render" }
palette = { version = "=0.7.6", default-features = false, features = ["libm"] }
# 0.7.7's derive output references types absent from palette 0.7.6.
palette_derive = "=0.7.6"
color = { version = "=0.3.3", default-features = false, features = ["libm"] }
libm = "=0.2.16"
cssparser = "=0.37.0"
cssparser-color = "=0.5.0"
csscolorparser = "=0.8.3"
serde_json = "=1.0.141"
sha2 = "=0.10.9"
png = "=0.17.16"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
wasm-bindgen = "=0.2.126"

[profile.dev]
opt-level = 2
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
