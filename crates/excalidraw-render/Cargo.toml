[package]
name = "excalidraw-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust rendering of Excalidraw scene documents"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/excalidraw-render"
readme = "../../README.md"
keywords = ["excalidraw", "rendering", "svg", "png", "pdf"]
categories = ["graphics", "rendering"]

[lints]
workspace = true

[features]
default = ["cjk"]
cjk = ["excalidraw-fonts/cjk"]
# Runs the release-mode qualification set under `cargo test`: the corpus-driven
# and generated-property tests that take minutes even when optimized, so the
# push gate leaves them `#[ignore]`d and the release-mode workflows enable the
# feature and run them in `--release`. The feature adds nothing to the library;
# it only lifts the `#[ignore]` from those `#[cfg(test)]` functions.
release-qualification = []

[dependencies]
excalidraw-fonts.workspace = true
base64.workspace = true
csscolorparser.workspace = true
cssparser.workspace = true
cssparser-color.workspace = true
crc32fast.workspace = true
gif.workspace = true
image-webp.workspace = true
krilla.workspace = true
libm.workspace = true
miniz_oxide.workspace = true
moxcms.workspace = true
serde.workspace = true
serde_json.workspace = true
simplecss.workspace = true
sha2.workspace = true
skera.workspace = true
png.workspace = true
resvg.workspace = true
roxmltree.workspace = true
harfrust.workspace = true
ttf-parser.workspace = true
ryu-js.workspace = true
unicode-bidi.workspace = true
svgtypes.workspace = true
tiny-skia.workspace = true
ttf2woff2.workspace = true
usvg.workspace = true
wuff.workspace = true
# Also the parser, via `write_fonts::read`, for subset validation (ADR-0020).
write-fonts.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
excalidraw-render-compare = { path = "../excalidraw-render-compare" }
jpeg-encoder.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
