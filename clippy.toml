    { path = "f32::atanh", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::exp", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::exp2", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::exp_m1", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::ln", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::ln_1p", reason = "route through crate::portable_math (ADR-0007)" },
    { path = "f32::log", reason = "route through crate::portable_math (ADR-0007)" },
