name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Clippy
        run: just clippy

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check advisories, licenses and sources
        run: just deny

  features:
    name: Clippy (features)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Clippy without default features and with each one alone
        run: just features

  msrv:
    name: Rust 1.92
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv --option languages.rust.version:string 1.92.0 shell -- {0}

      - name: Check MSRV
        shell: devenv --option languages.rust.version:string 1.92.0 shell -- bash -e {0}
        run: just msrv

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Some checks read files from earlier commits.
          fetch-depth: 0

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      # The fast and render tiers share one compilation of the test targets.
      - name: Fast tier
        run: just test

      - name: Render tier
        run: just test-render

  test-doc:
    name: Test (doc)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Doc tests
        run: just test-doc

  test-features:
    name: Test (features)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Test the builds that leave out PNG or PDF
        run: just test-features

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Verify cases, ledgers and approved evidence
        run: just conformance

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
          workspaces: |
            . -> target
            tests/package-consumer -> ../../target/package-consumer

      - name: Check the packaged crates
        run: just packaging
