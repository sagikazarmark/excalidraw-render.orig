name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: formatting and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install rustfmt and clippy for the pinned toolchain
        run: rustup component add rustfmt clippy
      # Every repo-authored crate. The vendored skera fork keeps upstream
      # formatting. xtask joined when the #133/#150 PDF round
      # re-pinned xtask/src/pdf_viewers.rs (issue #35).
      - name: Check formatting
        run: >-
          cargo fmt --check
          -p excalidraw-render -p excalidraw-render-cli -p excalidraw-render-compare
          -p excalidraw-render-assets-base
          -p excalidraw-render-assets-data-000 -p excalidraw-render-assets-data-001
          -p xtask
      # `--no-deps` keeps the vendored skera fork out of the gate: it is a
      # workspace member, so `--exclude` alone would still lint it as a
      # dependency of the selected packages. No lint is allowed: the
      # `manual_is_multiple_of` and `chunks_exact_to_as_chunks` occurrences
      # that sat in the #99-pinned files were fixed in the font approval round
      # that re-pinned them (#141).
      - name: Lint the renderer, CLI, and xtask
        run: >-
          cargo clippy --locked --no-deps --all-targets
          -p excalidraw-render -p excalidraw-render-cli -p xtask
          -- -D warnings

  registered-cases:
    name: registered conformance cases
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify every registered conformance case
        run: cargo run --locked -p xtask -- conformance verify-all

  workspace-suite:
    name: workspace test suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash tests/package-consumer/install-rust-toolchain.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/rust"
      - name: Install pinned cargo-nextest
        shell: bash
        run: bash tests/package-consumer/install-cargo-nextest.sh "$RUNNER_TEMP/nextest"
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # The push gate is the `ci-fast` and `ci-render` nextest profiles from
      # `.config/nextest.toml`, which together cover the `default` profile
      # exactly once: every unit and integration test target in every
      # workspace crate, built with the optimized `test` profile from the root
      # Cargo.toml, so a test target that no workflow names still gates a
      # push. Each profile selects its tier by binary name and kind rather than
      # by a list of test names, so a renamed test cannot drop out of the gate.
      #
      # `#[ignore]`d tests stay ignored: the nightly workflow runs its three
      # expansions, the PDF harness gates workflow runs the `harness` profile,
      # and the `release-qualification` feature (off here) holds the frame
      # batch property test for the release-mode run in the packaged-facade
      # workflow. The SVG font subset qualification corpus is digest-pinned by
      # issue #99 and cannot carry that feature gate until its next re-approval
      # round, so the profiles exclude it by name; the packaged-facade workflow
      # runs it in `--release` on the same push and fails its evidence step if
      # the corpus test did not execute.
      - name: Run the fast tier
        run: cargo nextest run --locked --workspace --profile ci-fast
      # The registry-driven parity harnesses and the fixed parser ceilings.
      - name: Run the render tier
        run: cargo nextest run --locked --workspace --profile ci-render
      # nextest does not run doc tests.
      - name: Run every doc test
        run: cargo test --locked --workspace --doc
