name: Reference oracle

# The reference oracle is the only source of what the pinned Excalidraw
# release draws, and it runs in no per-change gate. This verifies, once a
# week, that the pinned profile still reproduces and that every registered
# case regenerates to its committed evidence byte for byte, so drift in the
# oracle's closure or a generator is seen within days rather than when the
# oracle is next needed. The runner is linux/amd64 with Docker, which is what
# the pinned images need (docs/development/ci.md).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  oracle:
    name: Reference oracle drift check
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify the scene reference profile
        run: just reference-profile verify scene

      - name: Verify the frame reference profile
        run: just reference-profile verify frame

      - name: Reproduce every registered case
        run: just reference-cases reproduce

      - name: Upload the reproduction
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-evidence
          path: target/reference-evidence
          if-no-files-found: ignore

  report:
    name: Report a scheduled failure
    needs: [oracle]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update the failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          title="Scheduled ${WORKFLOW} run failed"
          body="[Run ${GITHUB_RUN_ID}](${RUN_URL}) failed on $(date -u +%F)."
          gh label create scheduled-failure --force --color B60205 \
            --description "A scheduled workflow run failed" >/dev/null
          existing="$(gh issue list --state open --label scheduled-failure \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --label scheduled-failure,needs-triage --body "${body}"
          fi
