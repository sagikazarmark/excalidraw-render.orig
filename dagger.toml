ignore = [".devenv", "target"]

[modules.excalidraw-render]
source = "."
entrypoint = true

# The Rust image the evidence operations run in; devenv pins the gates' toolchain.
settings.rustVersion = "1.97.1-slim-trixie"

# The evidence operations build their container with it. Its own checks stay
# skipped: the gates run from the justfile (ADR-0024).
[modules.rust]
source = "github.com/sagikazarmark/daggerverse-beta/rust"
check.skip = ["rust"]

settings.version = "1.97.1-slim-trixie"

