[package]
name = "bmp-evaluation"
version = "0.0.0"
edition = "2021"
publish = false

# Isolated experiment: BMP is not enabled in the production workspace.
[workspace]

[dependencies]
base64 = "=0.22.1"
excalidraw-render = { path = "../../crates/excalidraw-render" }
image = { version = "=0.25.10", default-features = false, features = ["bmp"] }
png = "=0.17.16"
serde_json = "=1.0.141"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[profile.dev]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
