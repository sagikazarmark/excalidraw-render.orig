# Temporary measurements for the CI layout; remove once decided.
name: CI experiments

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  # Why the xtask coverage tests take minutes on a runner and seconds on a laptop.
  xtask-profile:
    name: Profile xtask
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@103adba998fdfd83aa69c5f3c1f5854d23318f66 # cachix-push (sagikazarmark/setup-devenv#1)
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          cmd-format: devenv shell -- {0}

      - name: Runner
        run: nproc; free -h; df -h /

      - name: Build the xtask tests
        run: cargo nextest run --locked -p xtask --profile ci-fast --no-run

      - name: Slow xtask tests, one at a time
        run: >-
          cargo nextest run --locked -p xtask --profile ci-fast -j 1
          -E 'binary(coverage) | binary(representative_candidate)'

      - name: Slow xtask tests, four at a time
        run: >-
          cargo nextest run --locked -p xtask --profile ci-fast -j 4
          -E 'binary(coverage) | binary(representative_candidate)'

      - name: CLI resource use and subprocesses
        run: |
          xtask="$(ls -t target/debug/xtask | head -1)"
          mkdir -p target/profile
          for command in "conformance layers-report" "conformance verify-ownership" "conformance verify-layers"; do
            name="${command// /-}"
            echo "::group::$command"
            nix run nixpkgs#time -- -v "$xtask" $command > /dev/null 2> "target/profile/$name.time" || true
            grep -E 'Elapsed|User time|System time|Maximum resident|context switches|File system' "target/profile/$name.time"
            nix run nixpkgs#strace -- -f -c -o "target/profile/$name.strace" "$xtask" $command > /dev/null 2>&1 || true
            head -25 "target/profile/$name.strace"
            nix run nixpkgs#strace -- -f -e trace=execve -o "target/profile/$name.exec" "$xtask" $command > /dev/null 2>&1 || true
            echo "subprocesses: $(grep -c 'execve(' "target/profile/$name.exec")"
            grep -oE 'execve\("[^"]+"' "target/profile/$name.exec" | sort | uniq -c | sort -rn | head
            echo "::endgroup::"
          done

      - name: Upload the profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtask-profile
          path: target/profile

  # One compilation in an archive, then the fast tier in three shards.
  nextest-archive:
    name: Nextest archive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@103adba998fdfd83aa69c5f3c1f5854d23318f66 # cachix-push (sagikazarmark/setup-devenv#1)
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          cmd-format: devenv shell -- {0}

      - name: Archive the workspace tests
        run: |
          cargo nextest archive --locked --workspace --archive-file nextest.tar.zst
          ls -lh nextest.tar.zst

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest.tar.zst
          compression-level: 0
          retention-days: 1

  nextest-shard:
    name: Fast tier (shard ${{ matrix.shard }}/3)
    needs: nextest-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@103adba998fdfd83aa69c5f3c1f5854d23318f66 # cachix-push (sagikazarmark/setup-devenv#1)
        with:
          cachix-cache: rust-projects
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Run the shard
        run: >-
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap .
          --profile ci-fast --partition count:${{ matrix.shard }}/3
