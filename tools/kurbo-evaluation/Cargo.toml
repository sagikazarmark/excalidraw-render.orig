[package]
name = "kurbo-evaluation"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
excalidraw-render = { path = "../../crates/excalidraw-render" }
kurbo = { version = "=0.11.3", default-features = false, features = ["libm"] }
libm = "=0.2.16"
miniz_oxide = "=0.8.9"
png = "=0.17.16"
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
serde_json = "=1.0.141"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[profile.dev]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
