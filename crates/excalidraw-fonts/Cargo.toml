[package]
name = "excalidraw-render-fonts"
version = "0.1.0+excalidraw.0.18.1"
edition.workspace = true
rust-version.workspace = true
description = "Font payloads and catalog for excalidraw-render (internal; no stability guarantees outside it)"
# The crate's code is MIT OR Apache-2.0; the bundled fonts are OFL-1.1 except
# Comic Shanns (MIT). LICENSE-BUNDLE.txt carries every license and notice.
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND MIT"
repository.workspace = true
documentation = "https://docs.rs/excalidraw-render-fonts"
readme = "README.md"
keywords = ["excalidraw", "fonts"]
categories = ["graphics"]
include = [
    "/src/",
    "/catalog/",
    "/fonts/",
    "/license-parts/",
    "/LICENSE-BUNDLE.txt",
    "/LICENSE-BUNDLE.sha256",
    "/README.md",
]

[lints]
workspace = true

[features]
default = ["cjk"]
cjk = ["dep:excalidraw-fonts-xiaolai", "dep:excalidraw-fonts-xiaolai-extended"]

[dependencies]
excalidraw-fonts-xiaolai = { workspace = true, optional = true }
excalidraw-fonts-xiaolai-extended = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
write-fonts.workspace = true
wuff.workspace = true
